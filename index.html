<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marc Grading System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="login-page">
        <h1>Login</h1>
        <form id="login-form">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required><br>

            <button type="submit">Login</button>
        </form>
        <p id="login-error" style="color: red; display: none;">Invalid username or password.</p>
    </div>

    <div id="dashboard" style="display: none;">
        <div class="dashboard-box">
            <h1>Marc Grading System</h1>
            <p>Enter your scores below:</p>

            <div id="grading-form" class="columns">
                <div class="input-box">
                    <label for="subject1">Math:</label>
                    <input type="number" id="subject1" name="subject1" placeholder="Enter score for Math">
                    <div class="individual-result" id="result-math"></div>
                </div>
                <div class="input-box">
                    <label for="subject2">English:</label>
                    <input type="number" id="subject2" name="subject2" placeholder="Enter score for English">
                    <div class="individual-result" id="result-english"></div>
                </div>
                <div class="input-box">
                    <label for="subject3">Science:</label>
                    <input type="number" id="subject3" name="subject3" placeholder="Enter score for Science">
                    <div class="individual-result" id="result-science"></div>
                </div>
            </div>
            <button id="calculate-button" style="margin-top: 15px;">Calculate</button>

            <div id="display-data" class="columns results-row">
                <div class="result-box">
                    <h3>Total</h3>
                    <span id="display-total">0</span>
                </div>
                <div class="result-box">
                    <h3>Average</h3>
                    <span id="display-average">0</span>
                </div>
                <div class="result-box">
                    <h3>Grade</h3>
                    <span id="display-grade"></span>
                </div>
            </div>

            <button id="logout-button">Logout</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
