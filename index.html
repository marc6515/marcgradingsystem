<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marc Grading System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="login-page">
        <h1>Login</h1>
        <form id="login-form">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required><br>
            <button type="submit">Login</button>
        </form>
        <p id="login-error" style="color: red; display: none;">Invalid username or password.</p>
    </div>

    <div id="dashboard" style="display: none;">
        <div class="dashboard-box">
            <h1>Marc Grading System</h1>
            <p>Enter student name and scores below:</p>

            <div id="grading-form" class="columns">
                <div class="input-box">
                    <label for="student-name">Student Name:</label>
                    <input type="text" id="student-name" name="student-name" placeholder="Enter student name">
                </div>
                <div class="input-box">
                    <label for="subject1">Math:</label>
                    <input type="number" id="subject1" name="subject1" placeholder="Math">
                </div>
                <div class="input-box">
                    <label for="subject2">English:</label>
                    <input type="number" id="subject2" name="subject2" placeholder="English">
                </div>
                <div class="input-box">
                    <label for="subject3">Science:</label>
                    <input type="number" id="subject3" name="subject3" placeholder="Science">
                </div>
                <div class="input-box">
                    <label for="subject4">Filipino:</label>
                    <input type="number" id="subject4" name="subject4" placeholder="Filipino">
                </div>
                <div class="input-box">
                    <label for="subject5">PE:</label>
                    <input type="number" id="subject5" name="subject5" placeholder="PE">
                </div>
            </div>
            <button id="add-student-button" style="margin-top: 15px;">Add Student</button>

            <h2 style="margin-top:30px;">Student Grades</h2>
            <div style="overflow-x:auto;">
                <table id="students-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Math</th>
                            <th>English</th>
                            <th>Science</th>
                            <th>Filipino</th>
                            <th>PE</th>
                            <th>Total</th>
                            <th>Average</th>
                            <th>Grade</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Student rows will be added here -->
                    </tbody>
                </table>
            </div>

            <button id="logout-button" style="margin-top: 25px;">Logout</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
